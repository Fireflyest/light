        - file: ./RTE/Device/STM32F401RCTx/system_stm32f4xx.c
        - file: ./RTE/Device/STM32F401RCTx/startup_stm32f401xc.s
    - group: Middlewares Files
      files:
        - file: ./Middlewares/inc/usystem.h
        - file: ./Middlewares/src/usystem.c
        - file: ./Middlewares/inc/usart1.h
        - file: ./Middlewares/src/usart1.c
        - file: ./Middlewares/inc/dma.h
        - file: ./Middlewares/src/dma.c
